apiVersion: v1
kind: Service
metadata:
  name: model
  namespace: alu-chess
spec:
  selector:
    app: model
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model
  namespace: alu-chess
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model
  template:
    metadata:
      labels:
        app: model
    spec:
      containers:
        - name: model
          image: localhost/alu-chess-model:0.1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          env:
            - name: PORT
              value: "8082"
            - name: ENGINE_BASE_URL
              value: "http://stockfish:8000"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0"
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

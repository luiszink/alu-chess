apiVersion: v1
kind: Service
metadata:
  name: lichess
  namespace: alu-chess
spec:
  selector:
    app: lichess
  ports:
    - name: http
      port: 8085
      targetPort: 8085
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lichess
  namespace: alu-chess
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lichess
  template:
    metadata:
      labels:
        app: lichess
    spec:
      containers:
        - name: lichess
          image: localhost/alu-chess-lichess:0.1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8085
          env:
            - name: PORT
              value: "8085"
            - name: LICHESS_BASE_URL
              value: "https://lichess.org"
            - name: LICHESS_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: alu-chess-secrets
                  key: LICHESS_BOT_TOKEN
                  optional: true
            - name: LICHESS_AUTO_ACCEPT
              value: "true"
            - name: LICHESS_ACCEPT_RATED
              value: "false"
            - name: LICHESS_ACCEPT_VARIANTS
              value: "standard"
            - name: LICHESS_MIN_INITIAL_SECONDS
              value: "180"
            - name: LICHESS_MAX_INITIAL_SECONDS
              value: "900"
            - name: LICHESS_MAX_GAMES_CONCURRENT
              value: "2"
            - name: AI_TIME_LIMIT_MS
              value: "2000"
            - name: AI_MAX_DEPTH
              value: "4"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0"
          readinessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

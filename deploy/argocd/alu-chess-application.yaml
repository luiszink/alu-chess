apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alu-chess
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/luiszink/alu-chess.git
    targetRevision: main
    path: deploy/helm/alu-chess
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: alu-chess
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

concurrency:
  group: alu-chess-gitops
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/luiszink/alu-chess
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha || github.sha }}
  VALUES_FILE: deploy/helm/alu-chess/values-prod.yaml

jobs:
  build-and-push:
    name: Build and push backend images
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push stockfish
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.stockfish
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/stockfish:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}/stockfish:latest
          cache-from: type=gha,scope=stockfish
          cache-to: type=gha,scope=stockfish,mode=max

      - name: Build and push model
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.model
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/model:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}/model:latest
          cache-from: type=gha,scope=model
          cache-to: type=gha,scope=model,mode=max

      - name: Build and push playerservice
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.playerservice
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/playerservice:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}/playerservice:latest
          cache-from: type=gha,scope=playerservice
          cache-to: type=gha,scope=playerservice,mode=max

      - name: Build and push controller
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.controller
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/controller:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}/controller:latest
          cache-from: type=gha,scope=controller
          cache-to: type=gha,scope=controller,mode=max

      - name: Build and push lichess
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.lichess
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/lichess:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}/lichess:latest
          cache-from: type=gha,scope=lichess
          cache-to: type=gha,scope=lichess,mode=max

      # ── Kafka AI worker (docker-compose: "kafka-scala-worker") ──────
      # Verarbeitet chess-ai-requests -> chess-ai-responses und ist die
      # Persistence-Consumer-Komponente. Notwendig fuer KI-Zuege im
      # Multi-Game-/Zeitformat-Pfad (KafkaAiCoordinator).
      - name: Build and push aiworker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.aiworker
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/aiworker:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}/aiworker:latest
          cache-from: type=gha,scope=aiworker
          cache-to: type=gha,scope=aiworker,mode=max

      # ── Spark Analytics ────────────────────────────────────────────
      - name: Build and push spark-analytics
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.sparkanalytics
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/spark-analytics:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}/spark-analytics:latest
          cache-from: type=gha,scope=spark-analytics
          cache-to: type=gha,scope=spark-analytics,mode=max

      # ── Paket-Sichtbarkeit auf public setzen ───────────────────────
      # Neue ghcr.io-Pakete sind standardmaessig privat. Damit k3d/k3s sie
      # ohne imagePullSecret ziehen kann, werden sie auf "public" gesetzt.
      # Best-effort: GITHUB_TOKEN kann je nach Account-Einstellung die
      # Sichtbarkeit evtl. nicht aendern -> dann einmalig manuell unter
      # github.com/users/luiszink/packages -> Package -> Settings -> Change visibility.
      - name: Make packages public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pkg in aiworker spark-analytics lichess; do
            echo "Setze ghcr.io/luiszink/alu-chess/${pkg} auf public ..."
            gh api \
              --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/user/packages/container/alu-chess%2F${pkg}/visibility" \
              -f visibility='public' \
              && echo "  -> public" \
              || echo "  -> konnte Sichtbarkeit nicht setzen (manuell pruefen)"
          done

      - name: Refresh GitOps branch
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Update backend image tags for Argo CD
        run: |
          for service in stockfish model playerservice controller lichess aiworker spark-analytics; do
            sed -i "/^  ${service}:$/,/^  [a-z]/ s/tag: .*/tag: ${IMAGE_TAG}/" "${VALUES_FILE}"
          done

      - name: Commit GitOps update
        run: |
          if git diff --quiet -- "${VALUES_FILE}"; then
            echo "No GitOps changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${VALUES_FILE}"
          git commit -m "chore(gitops): update backend images to ${IMAGE_TAG} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

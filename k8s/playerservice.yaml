apiVersion: apps/v1
kind: Deployment
metadata:
  name: playerservice
  namespace: chess
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playerservice
  template:
    metadata:
      labels:
        app: playerservice
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: playerservice
          image: ghcr.io/luiszink/alu-chess/playerservice:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
          env:
            - name: PORT
              value: "8083"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: playerservice
  namespace: chess
spec:
  selector:
    app: playerservice
  ports:
    - port: 8083
      targetPort: 8083

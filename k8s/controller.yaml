apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  namespace: chess
spec:
  replicas: 1
  selector:
    matchLabels:
      app: controller
  template:
    metadata:
      labels:
        app: controller
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: controller
          image: ghcr.io/luiszink/alu-chess/controller:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: PORT
              value: "8081"
            - name: PLAYER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: chess-config
                  key: PLAYER_SERVICE_URL
            - name: DB_TYPE
              valueFrom:
                configMapKeyRef:
                  name: chess-config
                  key: DB_TYPE
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: chess-db-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chess-db-secret
                  key: DB_PASSWORD
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: chess-db-secret
                  key: DB_URL
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: chess-db-secret
                  key: MONGO_URI
            - name: MONGO_DB
              valueFrom:
                secretKeyRef:
                  name: chess-db-secret
                  key: MONGO_DB
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: controller
  namespace: chess
spec:
  selector:
    app: controller
  type: NodePort
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081

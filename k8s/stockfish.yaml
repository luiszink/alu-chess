apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockfish
  namespace: chess
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stockfish
  template:
    metadata:
      labels:
        app: stockfish
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: stockfish
          image: ghcr.io/luiszink/alu-chess/stockfish:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "800m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: stockfish
  namespace: chess
spec:
  selector:
    app: stockfish
  ports:
    - port: 8000
      targetPort: 8000
